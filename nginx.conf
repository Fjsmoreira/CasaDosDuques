# ===================================================================
# TLS / HTTPS termination
# -------------------------------------------------------------------
# This origin intentionally listens on port 80 (HTTP) only. TLS is
# terminated upstream at the CDN / load balancer, which also enforces:
#   - HTTP → HTTPS redirection
#   - HSTS (Strict-Transport-Security)
# The redirects below still emit absolute https:// targets so the
# canonical scheme is preserved end-to-end. Do NOT add a `listen 443`
# / ssl block here unless TLS termination is moved to this origin.
# ===================================================================

# -------------------------------------------------------------------
# www → non-www canonical redirect
# -------------------------------------------------------------------
server {
    listen 80;
    server_name www.casadosduques.pt;
    return 301 https://casadosduques.pt$request_uri;
}

server {
    listen 80;
    server_name casadosduques.pt;
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------
    # 410 Gone — legacy SEO-spam query strings (2026 WordPress hack)
    # The hacked WP served spam to crawlers under ?u=... and ?sitemap.xml.
    # 410 makes Google drop them permanently (faster than 404).
    # -------------------------------------------------------------------
    if ($arg_u) { return 410; }
    if ($args ~* (^|&)sitemap\.xml($|&)) { return 410; }

    # -------------------------------------------------------------------
    # 301 Redirects — Old WordPress paths → new Astro paths
    # -------------------------------------------------------------------
    rewrite ^/a-casa/?$                  /the-house/        permanent;
    rewrite ^/a-casa-2/?$                /pt/a-casa/        permanent;
    rewrite ^/comodidades/?$             /amenities/        permanent;
    rewrite ^/galeria/?$                 /garden/           permanent;
    rewrite ^/localizacao/?$             /location/         permanent;
    rewrite ^/actividades/?$             /things-to-do/     permanent;
    rewrite ^/reservas/?$                /booking/          permanent;
    rewrite ^/contactos/?$               /contact/          permanent;
    rewrite ^/politica-de-privacidade/?$ /privacy/          permanent;

    # -------------------------------------------------------------------
    # 301 Redirects — Legacy aliases
    # -------------------------------------------------------------------
    rewrite ^/activities/?$  /things-to-do/  permanent;
    rewrite ^/gallery/?$     /garden/        permanent;

    # -------------------------------------------------------------------
    # 301 Redirects — English slug aliases → translated locale paths
    # (Previously handled by client-side JS; now server-side for SEO)
    # -------------------------------------------------------------------

    # PT — English slug → Portuguese canonical
    rewrite ^/pt/the-house/?$     /pt/a-casa/       permanent;
    rewrite ^/pt/rooms/?$         /pt/quartos/      permanent;
    rewrite ^/pt/amenities/?$     /pt/comodidades/  permanent;
    rewrite ^/pt/garden/?$        /pt/jardim/       permanent;
    rewrite ^/pt/gallery/?$       /pt/jardim/       permanent;
    rewrite ^/pt/location/?$      /pt/localizacao/  permanent;
    rewrite ^/pt/things-to-do/?$  /pt/o-que-fazer/  permanent;
    rewrite ^/pt/day-trips/?$     /pt/passeios/     permanent;
    rewrite ^/pt/beaches/?$       /pt/praias/       permanent;
    rewrite ^/pt/rates/?$         /pt/precos/       permanent;
    rewrite ^/pt/booking/?$       /pt/reserva/      permanent;
    rewrite ^/pt/reviews/?$       /pt/avaliacoes/   permanent;
    rewrite ^/pt/contact/?$       /pt/contato/      permanent;
    rewrite ^/pt/privacy/?$       /pt/privacidade/  permanent;

    # NL — English slug → Dutch canonical
    rewrite ^/nl/the-house/?$     /nl/huis/          permanent;
    rewrite ^/nl/rooms/?$         /nl/slaapkamers/   permanent;
    rewrite ^/nl/amenities/?$     /nl/voorzieningen/ permanent;
    rewrite ^/nl/garden/?$        /nl/tuin/          permanent;
    rewrite ^/nl/gallery/?$       /nl/tuin/          permanent;
    rewrite ^/nl/location/?$      /nl/locatie/       permanent;
    rewrite ^/nl/things-to-do/?$  /nl/activiteiten/  permanent;
    rewrite ^/nl/day-trips/?$     /nl/daguitstapjes/ permanent;
    rewrite ^/nl/beaches/?$       /nl/stranden/      permanent;
    rewrite ^/nl/rates/?$         /nl/tarieven/      permanent;
    rewrite ^/nl/booking/?$       /nl/boeking/       permanent;

    # FR — English slug → French canonical
    rewrite ^/fr/the-house/?$     /fr/la-maison/      permanent;
    rewrite ^/fr/rooms/?$         /fr/chambres/       permanent;
    rewrite ^/fr/amenities/?$     /fr/equipements/    permanent;
    rewrite ^/fr/garden/?$        /fr/jardin/         permanent;
    rewrite ^/fr/gallery/?$       /fr/jardin/         permanent;
    rewrite ^/fr/location/?$      /fr/emplacement/    permanent;
    rewrite ^/fr/things-to-do/?$  /fr/activites/      permanent;
    rewrite ^/fr/day-trips/?$     /fr/excursions/     permanent;
    rewrite ^/fr/beaches/?$       /fr/plages/         permanent;
    rewrite ^/fr/rates/?$         /fr/tarifs/         permanent;
    rewrite ^/fr/booking/?$       /fr/reservation/    permanent;
    rewrite ^/fr/reviews/?$       /fr/avis/           permanent;
    rewrite ^/fr/privacy/?$       /fr/confidentialite/ permanent;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # API — proxy to Express server on port 3000
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files with cache
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /_astro/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # SPA-style routing for Astro static output
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
