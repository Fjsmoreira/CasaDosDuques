<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120">
  <defs>
    <style>
      .mark { fill: #c2673a; }
      .text { fill: #4a3728; font-family: Georgia, 'Times New Roman', serif; }
      .tagline { fill: #8b7355; }
      .bg { fill: #f8f5f0; }
    </style>
  </defs>

  <!-- Icon: azulejo diamond -->
  <g transform="translate(6,10)">
    <rect x="0" y="0" width="68" height="100" rx="4" class="bg" stroke="#c2673a" stroke-width="1.5"/>
    <line x1="34" y1="8" x2="34" y2="92" stroke="#c2673a" stroke-width="0.6" opacity="0.25"/>
    <line x1="8" y1="50" x2="60" y2="50" stroke="#c2673a" stroke-width="0.6" opacity="0.25"/>
    <circle cx="14" cy="14" r="3" class="mark" opacity="0.5"/>
    <circle cx="54" cy="14" r="3" class="mark" opacity="0.5"/>
    <circle cx="14" cy="86" r="3" class="mark" opacity="0.5"/>
    <circle cx="54" cy="86" r="3" class="mark" opacity="0.5"/>
    <circle cx="34" cy="50" r="4.5" class="mark"/>
  </g>

  <!-- Wordmark -->
  <text class="text" x="92" y="56" font-size="32" font-weight="bold" letter-spacing="1.5">Casa dos Duques</text>
  <!-- Tagline -->
  <text class="tagline" x="95" y="78" font-size="11" letter-spacing="4">ABIUL · CENTRAL PORTUGAL</text>

  <!-- Thin divider -->
  <line x1="92" y1="92" x2="340" y2="92" stroke="#c2673a" stroke-width="0.5" opacity="0.3"/>
</svg>
